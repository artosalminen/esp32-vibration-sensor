# Home Assistant automations for the dartboard lights.
#
# Paste each automation into Settings > Automations & Scenes > Create
# Automation > "Edit in YAML", one at a time, or drop both into your
# automations.yaml. No helpers needed.
#
# Entities used:
#   binary_sensor.dartboard_impact_sensor_dartboard_hit -> the ESPHome sensor
#   switch.office_p300_darts_board_light                -> board light (Tapo P300)
#   switch.office_p300_darts_display                    -> display (Tapo P300)
#   light.darts_mood_light                              -> PLACEHOLDER: replace
#                                                          with your mood light
#
# Note: the P300 outlets also have their own "auto off" timers
# (switch.office_darts_*_auto_off_enabled). Leave those disabled, or set
# them longer than 15 minutes, so they don't switch off mid-game.

- id: darts_lights_on_after_three_hits
  alias: "Darts: lights on after 3 hits in 30 s"
  description: >
    Turns on the board light, display and mood light when the dartboard is
    hit three times within 30 seconds. The first hit starts the 30 s window;
    the next two hits have to land before it runs out. A single knock or
    bump therefore doesn't switch anything on.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.dartboard_impact_sensor_dartboard_hit
      from: "off"
      to: "on"
  actions:
    # Hit 2, within 30 s of hit 1
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.dartboard_impact_sensor_dartboard_hit
          from: "off"
          to: "on"
      timeout: "00:00:30"
      continue_on_timeout: false
    # Hit 3, within whatever is left of the same 30 s window
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.dartboard_impact_sensor_dartboard_hit
          from: "off"
          to: "on"
      timeout:
        seconds: "{{ wait.remaining | float(0) }}"
      continue_on_timeout: false
    - action: homeassistant.turn_on
      target:
        entity_id:
          - switch.office_p300_darts_board_light
          - switch.office_p300_darts_display
          - light.darts_mood_light

- id: darts_lights_off_after_15_min_idle
  alias: "Darts: board light and display off after 15 min without hits"
  description: >
    Turns off the board light and display once 15 minutes have passed
    without a hit. The mood light is left on. Also covers the lights being
    switched on by hand and then never played under.
  mode: single
  triggers:
    # 15 minutes after the last hit
    - trigger: state
      entity_id: binary_sensor.dartboard_impact_sensor_dartboard_hit
      to: "off"
      for: "00:15:00"
    # Lights switched on manually and left on for 15 minutes
    - trigger: state
      entity_id:
        - switch.office_p300_darts_board_light
        - switch.office_p300_darts_display
      to: "on"
      for: "00:15:00"
  conditions:
    # No hit in the last 15 minutes
    - condition: state
      entity_id: binary_sensor.dartboard_impact_sensor_dartboard_hit
      state: "off"
      for: "00:15:00"
    # Something is actually on
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.office_p300_darts_board_light
          state: "on"
        - condition: state
          entity_id: switch.office_p300_darts_display
          state: "on"
  actions:
    - action: switch.turn_off
      target:
        entity_id:
          - switch.office_p300_darts_board_light
          - switch.office_p300_darts_display

# Example Home Assistant automations for the dartboard light.
#
# This is written as plain automation YAML so you can see the full logic.
# You can either:
#   a) paste each automation into Settings > Automations & Scenes >
#      Create Automation > "Edit in YAML", one at a time, or
#   b) if you manage automations.yaml directly, drop these into your
#      automations list.
#
# BEFORE USING: replace the placeholder entity IDs below with your real
# ones:
#   - binary_sensor.dartboard_hit         -> from the ESPHome device
#   - switch.dartboard_light              -> your Tapo socket entity
#   - timer.dartboard_light_timeout       -> the helper created below
#
# You also need a `timer` helper. Easiest way: Settings > Devices & Services
# > Helpers > Create Helper > Timer, name it "Dartboard light timeout",
# duration 00:30:00. Note the entity ID it gets (likely
# timer.dartboard_light_timeout) and use that below. Alternatively, define
# it in YAML under a `timer:` key in configuration.yaml:
#
# timer:
#   dartboard_light_timeout:
#     duration: "00:30:00"
#     name: Dartboard light timeout

- id: dartboard_light_on_hit
  alias: "Dartboard: turn on light and reset timeout"
  description: >
    Turns the dartboard light on whenever a hit is detected, and
    (re)starts the 30-minute idle timer. Restarting an already-running
    timer just pushes its end time out, so as long as you keep throwing,
    the light stays on.
  trigger:
    - platform: state
      entity_id: binary_sensor.dartboard_hit
      to: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.dartboard_light
    - service: timer.start
      target:
        entity_id: timer.dartboard_light_timeout
      # timer.start restarts the timer from its full duration if it's
      # already running, which is exactly the "keep resetting on every
      # throw" behaviour we want.

- id: dartboard_light_off_on_timeout
  alias: "Dartboard: turn off light after 30 min idle"
  description: >
    Turns the dartboard light off once the idle timer finishes without
    being reset by another hit.
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.dartboard_light_timeout
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.dartboard_light

# ============================================================================
# Dartboard impact sensor — diymore ESP32-C3 (0.42" OLED) + SW-420
# ============================================================================
#
# HARDWARE:
#   - diymore ESP32-C3 dev board with built-in 0.42" 72x40 SSD1306 OLED
#     (OLED is wired internally to I2C SDA=GPIO5 / SCL=GPIO6, address 0x3C)
#   - Hailege SW-420 vibration switch module (digital output, onboard
#     comparator + sensitivity potentiometer)
#
# WIRING (SW-420 module -> ESP32-C3 board):
#   VCC -> 3V3
#   GND -> GND
#   DO  -> GPIO3   (change "sw420_pin" in substitutions if you use another pin;
#                  avoid GPIO2/8/9, they're strapping pins, and GPIO5/6, the OLED)
#
# HOW DETECTION WORKS:
#   The SW-420 is a spring switch: a knock makes it chatter, so its DO pin
#   produces a burst of pulses. We count rising edges in 100ms windows. If a
#   window holds at least "Hit Threshold" pulses, that counts as a hit. The
#   module's potentiometer is the coarse hardware sensitivity; the threshold
#   is the fine software one, adjustable from the board's BOOT button or
#   from Home Assistant.
#
# ON-BOARD UI (BOOT button = GPIO9):
#   - First press opens the threshold screen (no change yet)
#   - Short press while it's open: threshold +1 (wraps from max back to 1)
#   - Long press (>= 1s) while it's open: threshold -1
#   - The screen goes back to the status view 3s after the last press
#   Status view: WiFi / Home Assistant connection dots, a big "HIT!" when a
#   hit is detected, the current threshold and a live pulse-level bar.
# ============================================================================

substitutions:
  sw420_pin: GPIO3
  threshold_min: "1"
  threshold_max: "20"

esphome:
  name: dartboard-sensor
  friendly_name: Dartboard Impact Sensor

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi:
  id: wifi_conn
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # These small C3 boards have a poorly matched chip antenna: at full TX
  # power they see the router fine but fail to associate ("Auth Expired").
  # Capping output power fixes it.
  output_power: 8.5dB
  # Also reported to help these boards stay associated: no modem sleep, and
  # connect straight to the configured SSID instead of scanning first.
  power_save_mode: none
  fast_connect: true

api:
  id: api_server
  encryption:
    key: !secret dartboard_api_key

ota:
  platform: esphome
  password: !secret dartboard_ota_password

logger:
  logs:
    # pulse_counter logs every 100ms update at DEBUG; keep it quiet
    pulse_counter: INFO

globals:
  # millis() of the last detected hit, for the "HIT!" banner on the display
  - id: last_hit_ms
    type: uint32_t
    initial_value: "0"
  # millis() of the last BOOT button press, for the threshold screen
  - id: last_adjust_ms
    type: uint32_t
    initial_value: "0"
  - id: hit_count
    type: uint32_t
    initial_value: "0"

i2c:
  id: bus_a
  sda: GPIO5
  scl: GPIO6
  frequency: 400kHz

number:
  # Minimum SW-420 pulses within one 100ms window to count as a hit.
  # Lower = more sensitive. Persisted across reboots. Also shows up in Home
  # Assistant (device page > Configuration), so it can be tuned from there too.
  - platform: template
    name: "Hit Threshold"
    id: hit_threshold
    entity_category: config
    icon: mdi:tune-vertical
    min_value: ${threshold_min}
    max_value: ${threshold_max}
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    mode: box

sensor:
  # Raw edge counter on the SW-420 DO pin. ESP32-C3 has no hardware PCNT
  # peripheral, so this uses an interrupt-based counter. pulse_counter
  # reports pulses/minute; multiplying by 100ms/60000ms gives the count in
  # this 100ms window. Kept internal: it updates 10x a second, too often to
  # push to Home Assistant.
  - platform: pulse_counter
    id: vibration_pulses
    pin:
      number: ${sw420_pin}
      mode: INPUT
    use_pcnt: false
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    internal_filter: 200us
    update_interval: 100ms
    internal: true
    filters:
      - multiply: !lambda return 100.0f / 60000.0f;
      - lambda: return roundf(x);

  # Peak pulse count per second, published to Home Assistant for calibration:
  # watch it while the room is quiet and while throwing darts, and pick a
  # threshold between the two.
  - platform: copy
    source_id: vibration_pulses
    name: "Vibration Pulses"
    icon: mdi:vibrate
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - max:
          window_size: 10
          send_every: 10

binary_sensor:
  # Goes "on" when a 100ms window has at least "Hit Threshold" pulses, and
  # holds for 500ms so Home Assistant sees one clean pulse per hit.
  - platform: template
    name: "Dartboard Hit"
    id: dartboard_hit
    device_class: vibration
    lambda: |-
      return id(vibration_pulses).has_state() &&
             id(vibration_pulses).state >= id(hit_threshold).state;
    filters:
      - delayed_off: 500ms
    on_press:
      - lambda: |-
          id(last_hit_ms) = millis();
          id(hit_count) += 1;
      - component.update: oled

  # The board's BOOT button. Only read after boot, so its strapping role
  # doesn't matter here. Active low, has an external pull-up on the board.
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO9
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
    on_multi_click:
      # Long press: threshold -1
      - timing:
          - ON for at least 1s
        then:
          - lambda: |-
              bool open = millis() - id(last_adjust_ms) < 3000;
              id(last_adjust_ms) = millis();
              if (!open) return;
              float v = id(hit_threshold).state - 1;
              if (v < ${threshold_min}) v = ${threshold_min};
              auto call = id(hit_threshold).make_call();
              call.set_value(v);
              call.perform();
          - component.update: oled
      # Short press: threshold +1, wrapping around
      - timing:
          - ON for at most 600ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              bool open = millis() - id(last_adjust_ms) < 3000;
              id(last_adjust_ms) = millis();
              if (!open) return;
              float v = id(hit_threshold).state + 1;
              if (v > ${threshold_max}) v = ${threshold_min};
              auto call = id(hit_threshold).make_call();
              call.set_value(v);
              call.perform();
          - component.update: oled

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 18

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 72x40"
    address: 0x3C
    update_interval: 250ms
    lambda: |-
      const int W = it.get_width();   // 72
      const int H = it.get_height();  // 40
      const uint32_t now = millis();
      const int thr = (int) id(hit_threshold).state;

      // ---- Threshold adjust screen -------------------------------------
      if (id(last_adjust_ms) != 0 && now - id(last_adjust_ms) < 3000) {
        it.print(W / 2, 0, id(font_small), TextAlign::TOP_CENTER, "THRESHOLD");
        it.printf(W / 2, 11, id(font_big), TextAlign::TOP_CENTER, "%d", thr);
        // Position of the current value within min..max
        const int range = ${threshold_max} - ${threshold_min};
        const int fill = (thr - ${threshold_min}) * (W - 2) / range;
        it.rectangle(0, H - 6, W, 6);
        it.filled_rectangle(1, H - 5, fill, 4);
        return;
      }

      // ---- Status screen -----------------------------------------------
      // Top row: WiFi and Home Assistant API connection, filled dot = up.
      const bool wifi_ok = id(wifi_conn).is_connected();
      const bool api_ok = id(api_server).is_connected();
      it.print(0, -1, id(font_small), "WiFi");
      if (wifi_ok) it.filled_circle(27, 5, 3); else it.circle(27, 5, 3);
      it.print(43, -1, id(font_small), "HA");
      if (api_ok) it.filled_circle(61, 5, 3); else it.circle(61, 5, 3);

      // Middle: inverted "HIT!" banner for 2s after a hit, else hit count.
      if (id(last_hit_ms) != 0 && now - id(last_hit_ms) < 2000) {
        it.filled_rectangle(0, 11, W, 19);
        it.print(W / 2, 11, id(font_big), COLOR_OFF, TextAlign::TOP_CENTER, "HIT!");
      } else if (!wifi_ok) {
        // Blink while (re)connecting so a missing network is obvious.
        if ((now / 500) % 2) it.print(W / 2, 14, id(font_small), TextAlign::TOP_CENTER, "connecting");
      } else {
        it.printf(W / 2, 14, id(font_small), TextAlign::TOP_CENTER, "hits: %u", (unsigned) id(hit_count));
      }

      // Bottom row: threshold and a live pulse-level bar. The bar is full
      // when the current 100ms window reaches the threshold.
      it.printf(0, H - 10, id(font_small), "T%d", thr);
      const int bx = 20, bw = W - bx;
      it.rectangle(bx, H - 8, bw, 7);
      float p = id(vibration_pulses).has_state() ? id(vibration_pulses).state : 0;
      int fill = (int) (p * (bw - 2) / thr);
      if (fill > bw - 2) fill = bw - 2;
      if (fill > 0) it.filled_rectangle(bx + 1, H - 7, fill, 5);
